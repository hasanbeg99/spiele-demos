<style>

<script>
// ===== Psst! engine (pure logic) =====
const DV={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0],ul:[-1,-1],ur:[1,-1],dl:[-1,1],dr:[1,1]};
const DIRK=Object.keys(DV);
const ROTL={u:'l',l:'d',d:'r',r:'u',ul:'dl',dl:'dr',dr:'ur',ur:'ul'};
const ROTR={u:'r',r:'d',d:'l',l:'u',ul:'ur',ur:'dr',dr:'dl',dl:'ul'};
const WALKC='.dg';
const SOLIDC='#Wq';
const VR=6.6, VCOS=0.6;
function prep(L){
  if(L._p) return L; L._p=1;
  const H=L.map.length,W=L.map[0].length; L.W=W;L.H=H;
  L.g=L.map.map(r=>r.split(''));
  L.walk=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&WALKC.includes(L.g[y][x]);
  L.slotById={};
  for(const s of L.slots){L.slotById[s.id]=s;
    if(s.ax==null){for(const [dx,dy] of [[0,1],[0,-1],[-1,0],[1,0]]) if(L.walk(s.x+dx,s.y+dy)){s.ax=s.x+dx;s.ay=s.y+dy;break;}}
    s.fd=dirTo(s.ax,s.ay,s.x,s.y);
  }
  L.objById={}; for(const o of L.objs) L.objById[o.id]=o;
  L.charById={}; for(const c of L.chars) L.charById[c.id]=c;
  // rooms (flood fill not crossing doors/walls)
  L.room=new Int16Array(W*H).fill(-1); let rid=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const ch=L.g[y][x]; if(ch==='#'||ch==='W'||ch==='d'||L.room[y*W+x]>=0) continue;
    const st=[[x,y]]; L.room[y*W+x]=rid;
    while(st.length){const [cx,cy]=st.pop(); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy; if(nx<0||ny<0||nx>=W||ny>=H) continue; const c2=L.g[ny][nx]; if(c2==='#'||c2==='W'||c2==='d'||L.room[ny*W+nx]>=0) continue; L.room[ny*W+nx]=rid; st.push([nx,ny]);}}
    rid++;}
  L.nrooms=rid;
  // vision table
  L.vis={};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ if(!L.walk(x,y)) continue;
    for(const d of DIRK){const a=new Uint8Array(W*H); const [fx,fy]=DV[d]; const fl=Math.hypot(fx,fy);
      for(let ty=0;ty<H;ty++)for(let tx=0;tx<W;tx++){const dx=tx-x,dy=ty-y; const dist=Math.hypot(dx,dy);
        if(dist===0){a[ty*W+tx]=1;continue;} if(dist>VR) continue;
        if((dx*fx+dy*fy)/(dist*fl)<VCOS) continue;
        if(los(L,x,y,tx,ty)) a[ty*W+tx]=1;}
      L.vis[x+','+y+','+d]=a;}}
  L.dc={};
  return L;
}
function los(L,x0,y0,x1,y1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)*5);
  for(let i=1;i<n;i++){const t=i/n;const x=Math.floor(x0+(x1-x0)*t+0.5),y=Math.floor(y0+(y1-y0)*t+0.5);
    if((x===x1&&y===y1)||(x===x0&&y===y0)) continue; if(SOLIDC.includes(L.g[y][x])) return false;}
  return true;}
function dirTo(x0,y0,x1,y1){const dx=Math.sign(x1-x0),dy=Math.sign(y1-y0); for(const d of DIRK){if(DV[d][0]===dx&&DV[d][1]===dy) return d;} return 'd';}
function distTo(L,tx,ty){const k=tx+','+ty; if(L.dc[k]) return L.dc[k]; const W=L.W,H=L.H; const D=new Int16Array(W*H).fill(9999); D[ty*W+tx]=0; const q=[[tx,ty]];
  while(q.length){const [x,y]=q.shift(); for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){const nx=x+dx,ny=y+dy; if(!L.walk(nx,ny)) continue; if(D[ny*W+nx]>D[y*W+x]+1){D[ny*W+nx]=D[y*W+x]+1;q.push([nx,ny]);}}}
  return L.dc[k]=D;}
function stepToward(L,c,tx,ty){const D=distTo(L,tx,ty); let best=null,bd=D[c.y*L.W+c.x];
  for(const d of ['u','r','d','l']){const nx=c.x+DV[d][0],ny=c.y+DV[d][1]; if(!L.walk(nx,ny)) continue; const v=D[ny*L.W+nx]; if(v<bd){bd=v;best=d;}}
  if(best){c.x+=DV[best][0];c.y+=DV[best][1];c.dir=best;return true;} return false;}
function init(L){prep(L);
  const S={tick:0,steps:0,moves:0,chars:[],objs:{},flags:{},done:null,why:null,ev:[]};
  for(const o of L.objs) S.objs[o.id]={slot:o.slot||null,car:null};
  for(const cd of L.chars){const b={}; for(const o of L.objs) b[o.id]={s:(cd.belief&&cd.belief[o.id]!==undefined)?cd.belief[o.id]:(o.slot||null),t:0};
    S.chars.push({id:cd.id,x:cd.x,y:cd.y,dir:cd.dir,ti:0,tw:0,f:null,b,mood:null,open:null});}
  see(L,S); S.ev=[];
  return S;}
function clone(S){return JSON.parse(JSON.stringify(S));}
function objAtSlot(S,sid){for(const k in S.objs) if(S.objs[k].slot===sid) return k; return null;}
function seenBy(L,S,x,y){const r=[]; for(const c of S.chars){const cd=L.charById[c.id]; if(cd.blind) continue; const v=L.vis[c.x+','+c.y+','+c.dir]; if(v&&v[y*L.W+x]) r.push(c.id);} return r;}
function flag(S,f){if(!S.flags[f]){S.flags[f]=S.tick;}}
function act(L,S,c){const cd=L.charById[c.id]; const tasks=cd.tasks||[];
  for(let guard=0;guard<8;guard++){const t=tasks[c.ti]; if(!t) return;
    switch(t[0]){
      case 'wait': c.tw++; if(c.tw>=t[1]){c.tw=0;c.ti++;} return;
      case 'face': c.dir=t[1]; c.ti++; return;
      case 'flag': flag(S,t[1]); S.ev.push({t:'flag',c:c.id,f:t[1]}); c.ti++; continue;
      case 'mood': c.mood=t[1]; c.ti++; continue;
      case 'goto': if(c.x===t[1]&&c.y===t[2]){c.ti++;continue;} stepToward(L,c,t[1],t[2]); return;
      case 'fetch': {const o=t[1]; const f=c.f||(c.f={chk:{},look:-1});
        if(f.look>=0){const seq=f.seq; c.dir=seq[f.look]; f.look++; if(f.look>=seq.length) f.look=-1; return;}
        let tgt=c.b[o].s;
        if(tgt&&f.chk[tgt]!==undefined&&c.b[o].t<=f.chk[tgt]) tgt=null;
        if(!tgt||tgt[0]==='@'){ // search list
          tgt=null; for(const s of (cd.search||[])) if(f.chk[s]===undefined){tgt=s;break;}
          if(!tgt){c.f=null;c.ti++;c.mood='giveup';flag(S,'giveup:'+c.id);S.ev.push({t:'giveup',c:c.id,o});return;}
        }
        const sl=L.slotById[tgt];
        if(!(c.x===sl.ax&&c.y===sl.ay)){ if(c.mood==='q'||c.mood==='happy') c.mood=null; stepToward(L,c,sl.ax,sl.ay); if(!(c.x===sl.ax&&c.y===sl.ay)) return; }
        c.dir=sl.fd; c.open=tgt;
        if(S.objs[o].slot===tgt){S.objs[o].slot=null;S.objs[o].car=c.id;c.b[o]={s:'@'+c.id,t:S.tick};c.f=null;c.ti++;c.mood='happy';
          flag(S,'found:'+c.id+':'+o+':'+tgt);S.ev.push({t:'found',c:c.id,o,s:tgt});}
        else{f.chk[tgt]=S.tick;c.b[o]={s:null,t:S.tick};c.mood='q';flag(S,'miss:'+c.id+':'+o);S.ev.push({t:'miss',c:c.id,o,s:tgt});
          f.seq=[ROTL[c.dir],ROTL[ROTL[c.dir]],ROTR[c.dir]]; f.look=0;}
        return;}
      default: c.ti++; continue;
    }}}
function see(L,S){
  for(const c of S.chars){const cd=L.charById[c.id]; if(cd.blind){c.open=null;continue;} const v=L.vis[c.x+','+c.y+','+c.dir];
    for(const s of L.slots){const vis=v&&v[s.y*L.W+s.x]; const op=!s.closed||c.open===s.id; if(!(vis&&op)&&c.open!==s.id) continue;
      for(const o in S.objs){ if(S.objs[o].slot===s.id){ const was=c.b[o].s; c.b[o]={s:s.id,t:S.tick}; flag(S,'see:'+c.id+':'+o+':'+s.id); if(was!==s.id) S.ev.push({t:'belief',c:c.id,o,s:s.id}); } } }
    c.open=null;}
  if(L.gossip){for(let i=0;i<S.chars.length;i++)for(let j=i+1;j<S.chars.length;j++){const a=S.chars[i],b=S.chars[j];
    if(Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y))>1) continue;
    for(const o in S.objs){const ba=a.b[o],bb=b.b[o]; if(ba.t>bb.t&&ba.s!==bb.s&&ba.s&&ba.s[0]!=='@'){b.b[o]={s:ba.s,t:ba.t};S.ev.push({t:'tell',c:a.id,to:b.id,o,s:ba.s});flag(S,'tell:'+a.id+':'+b.id);}
      else if(bb.t>ba.t&&bb.s!==ba.s&&bb.s&&bb.s[0]!=='@'){a.b[o]={s:bb.s,t:bb.t};S.ev.push({t:'tell',c:b.id,to:a.id,o,s:bb.s});flag(S,'tell:'+b.id+':'+a.id);}}}}
}
function check(L,S){ if(S.done) return;
  if(L.win.every(f=>S.flags[f]!==undefined)){S.done='win';return;}
  for(const f of (L.fail||[])) if(S.flags[f]!==undefined){S.done='fail';S.why=f;return;}
  if(S.tick>=(L.maxT||60)){S.done='fail';S.why='time';}
}
function step(L,S){S.ev=[];S.tick++; for(const c of S.chars) act(L,S,c); see(L,S); check(L,S); return S;}
function canMove(L,S,o,sid){const od=L.objById[o]; const so=S.objs[o]; if(!od||od.fixed||!so.slot) return {ok:false,why:'fixed'};
  const sl=L.slotById[sid]; if(!sl||sid===so.slot) return {ok:false,why:'same'}; if(objAtSlot(S,sid)) return {ok:false,why:'full'};
  if(sl.only&&!sl.only.includes(o)) return {ok:false,why:'only'};
  const from=L.slotById[so.slot]; const a=seenBy(L,S,from.x,from.y), b=seenBy(L,S,sl.x,sl.y);
  if(a.length||b.length) return {ok:false,why:'seen',by:[...new Set([...a,...b])],fromSeen:a.length>0,toSeen:b.length>0};
  return {ok:true};}
// action: {t:'wait'} | {t:'move',o,s}
function apply(L,S,a){ if(S.done) return {ok:false};
  if(a.t==='move'){const r=canMove(L,S,a.o,a.s); if(!r.ok) return r; S.objs[a.o].slot=a.s; S.moves++;}
  S.steps++; step(L,S); return {ok:true};}
function legal(L,S){const acts=[{t:'wait'}]; for(const o of L.objs){ if(o.fixed||!S.objs[o.id].slot) continue; for(const s of L.slots){ if(canMove(L,S,o.id,s.id).ok) acts.push({t:'move',o:o.id,s:s.id}); } } return acts;}
function key(S){return JSON.stringify([S.tick,S.chars.map(c=>[c.x,c.y,c.dir,c.ti,c.tw,c.f,c.b,c.mood]),S.objs,Object.keys(S.flags).sort()]);}
// BFS (min steps). opts.filter(a) to forbid actions.
function solve(L,S0,opts={}){prep(L); const max=opts.max||60000; const seen=new Set([key(S0)]); let q=[{S:S0,p:[]}]; let n=0;
  while(q.length){const nq=[]; for(const it of q){ for(const a of legal(L,it.S)){ if(opts.filter&&!opts.filter(a)) continue; const S=clone(it.S); const r=apply(L,S,a); if(!r.ok) continue;
        const p=it.p.concat([a]); if(S.done==='win') return {path:p,nodes:n,S}; if(S.done) continue; const k=key(S); if(seen.has(k)) continue; seen.add(k); nq.push({S,p}); if(++n>max) return {path:null,nodes:n,capped:true}; } } q=nq; }
  return {path:null,nodes:n};}

const E={prep,init,step,apply,canMove,legal,solve,clone,seenBy,objAtSlot};
// ===== Levels =====
const LEVELS=[
{id:'keks',name:'Der Keks',victim:'Mia',
 map:["#########",
      "#ccccccf#",
      "#.......#",
      "#....tt.#",
      "#....tt.#",

  for(let i=fx.length-1;i>=0;i--){const f=fx[i]; const k=(now-f.t0)/f.dur; if(k>1.05){fx.splice(i,1);continue;} if(k<0) continue; drawFx(f,k,now);}
  // tutorial hand
  if(G.tut===1&&!busy&&!sel&&S.objs.cookie.slot&&!S.done){const s=L.slotById[S.objs.cookie.slot]; hand={t:'tap',x:cx(s.x),y:cy(s.y),t0:hand&&hand.t==='tap'?hand.t0:now};}
  if(G.tut===2&&!busy&&!S.done){const b=$('ff').getBoundingClientRect(); if(!hand||hand.t!=='btn') hand={t:'btn',x:b.left+b.width/2,y:b.top+b.height/2,t0:now};}
  if(hand) drawHand(now);
  // confetti
  if(conf.length){for(const p of conf){p.vy+=0.18;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr; ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();} conf=conf.filter(p=>p.y<H+30);}
}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}
function drawSlotOver(s,now,front){const x=cx(s.x),y=cy(s.y); if(s.kind==='jar'){drawFurn(ctx,'jar',x,y,T,s.lab);} else if(s.kind==='cup'){ if(front) drawFurn(ctx,'cup',x,y+T*.02,T*.9,({c1:'1',c2:'2',c3:'3'})[s.id]);} else if(s.kind==='hat'){drawFurn(ctx,'hat',x,y+T*.05,T*.85);} }
function drawEye(x,y,s){ctx.save();ctx.fillStyle='#d64550';ctx.beginPath();ctx.ellipse(x,y,s,s*.62,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,s*.35,0,7);ctx.fill();ctx.fillStyle='#2d1c23';ctx.beginPath();ctx.arc(x,y,s*.18,0,7);ctx.fill();ctx.restore();}
function drawImp(x,y,s){ctx.save();ctx.translate(x,y);ctx.fillStyle='#d64550';ctx.beginPath();ctx.moveTo(-s*.3,s*.2);ctx.quadraticCurveTo(0,-s*.6,s*.35,-s*.5);ctx.lineTo(s*.3,s*.2);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*.36,-s*.5,s*.09,0,7);ctx.fill();rr(ctx,-s*.34,s*.14,s*.68,s*.12,s*.06);ctx.fill();ctx.restore();}
function bubbleLayout(){const L=G.L,S=G.S,out=[]; for(const c of S.chars){const cd=L.charById[c.id]; if(!cd.focus) continue; const p=dispPos(c.id); out.push({c,cd,x:cx(p.x),y:cy(p.y)-T*1.25,hx:cx(p.x),hy:cy(p.y)-T*.5});}
  for(let it=0;it<4;it++)for(let i=0;i<out.length;i++)for(let j=i+1;j<out.length;j++){const a=out[i],b=out[j]; const dx=b.x-a.x; if(Math.abs(dx)<T*1.5&&Math.abs(a.y-b.y)<T*1.1){const push=(T*1.5-Math.abs(dx))/2+1; const sg=dx>=0?1:-1; a.x-=push*sg;b.x+=push*sg;}}
  for(const b of out){b.x=Math.max(T*.8,Math.min(W-T*.8,b.x)); b.y=Math.max($('hud').offsetHeight+T*.55,b.y);} return out;}
function drawBubbles(now){const L=G.L; const pul=fx.find(f=>f.t==='pulse'&&now-f.t0<f.dur);
  for(const B of bubbleLayout()){const {c,cd}=B; const b=c.b[cd.focus]; const bp=fx.find(f=>f.t==='bpulse'&&f.c===c.id&&now-f.t0<f.dur&&now>=f.t0);
    let sc=1; if(pul) sc+=.08*Math.sin((now-pul.t0)/130)*Math.max(0,1-(now-pul.t0)/pul.dur); if(bp) sc+=.25*Math.sin(Math.min(1,(now-bp.t0)/bp.dur)*Math.PI);
    if(G.tut===1) sc+=.06*Math.sin(now/180);
    const bw=T*1.32*sc,bh=T*.98*sc;
    // connector to ghost
    if(b.s&&b.s[0]!=='@'){const s=L.slotById[b.s]; ctx.save();ctx.strokeStyle=hexA(cd.col,.55);ctx.lineWidth=2;ctx.setLineDash([2,5]);ctx.beginPath();ctx.moveTo(B.x,B.y);ctx.lineTo(cx(s.x),cy(s.y));ctx.stroke();ctx.restore();}
    ctx.save(); ctx.fillStyle='#fffaf2'; ctx.strokeStyle=cd.col; ctx.lineWidth=2.5;
    // tail dots
    for(const [t,r] of [[.55,.09],[.8,.06]]){ctx.beginPath();ctx.arc(B.x+(B.hx-B.x)*t,B.y+bh*.4+(B.hy-B.y-bh*.4)*t,T*r,0,7);ctx.fill();ctx.stroke();}
    ctx.beginPath(); const cl=[[-.3,0,.36],[.05,-.12,.4],[.32,.04,.34],[0,.14,.38]]; for(const [dx,dy,r] of cl){ctx.moveTo(B.x+dx*bw+r*bh,B.y+dy*bh);ctx.arc(B.x+dx*bw,B.y+dy*bh,r*bh,0,7);} ctx.stroke(); ctx.fill();
    // content
    if(!b.s){drawIcon(ctx,'q',B.x,B.y,bh*.85);}
    else if(b.s[0]==='@'){drawIcon(ctx,L.objById[cd.focus].icon,B.x,B.y,bh*.62); ctx.strokeStyle='#2a9d8f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(B.x+bh*.25,B.y+bh*.15);ctx.lineTo(B.x+bh*.35,B.y+bh*.27);ctx.lineTo(B.x+bh*.55,B.y-bh*.02);ctx.stroke();}
    else{const s=L.slotById[b.s]; const gk=s.kind; drawFurn(ctx,gk==='jar'||gk==='cup'||gk==='hat'?gk:gk,B.x+bh*.22,B.y+bh*.08,bh*.62,s.lab||({c1:'1',c2:'2',c3:'3'})[s.id],true);
      drawIcon(ctx,L.objById[cd.focus].icon,B.x-bh*.26,B.y-bh*.05,bh*.58,cd.col);}
    ctx.restore();}}
function drawFx(f,k,now){const L=G.L;
  if(f.t==='qpop'){const p=dispPos(f.c); const e=k<.25?k/.25:1; const sc=(e<1? (1.6*e - .6*e*e*e):1)*(1+.08*Math.sin(now/90)); const a=k>.85?(1-k)/.15:1; ctx.save();ctx.globalAlpha=Math.max(0,a);
    const x=cx(p.x)+T*.55,y=cy(p.y)-T*.75; ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(x,y,T*.42*sc,0,7);ctx.fill();ctx.strokeStyle='#2d1c23';ctx.lineWidth=2;ctx.stroke(); drawIcon(ctx,'q',x,y,T*.8*sc);
    for(let i=0;i<3;i++){const ang=-1.2+i*.9+k*1.5; ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+Math.cos(ang)*T*.7*e,y+Math.sin(ang)*T*.6*e,3,0,7);ctx.fill();} ctx.restore();}
  if(f.t==='bang'){const p=dispPos(f.c); ctx.save();ctx.globalAlpha=1-k; const x=cx(p.x)+T*.5,y=cy(p.y)-T*.7; star(ctx,x,y,T*.35*(.6+k),T*.16*(.6+k)); ctx.fillStyle='#ffd166';ctx.fill();ctx.restore();}
  if(f.t==='sweat'){const p=dispPos(f.c); ctx.save();ctx.globalAlpha=1-k;ctx.fillStyle='#7fc8f8';ctx.beginPath();const x=cx(p.x)+T*.25,y=cy(p.y)-T*.55+k*T*.2;ctx.moveTo(x,y-T*.12);ctx.quadraticCurveTo(x+T*.1,y+T*.04,x,y+T*.06);ctx.quadraticCurveTo(x-T*.1,y+T*.04,x,y-T*.12);ctx.fill();ctx.restore();}
  if(f.t==='psst'){const x=cx(f.x),y=cy(f.y)-T*.55-k*T*.3; const a=k>.7?(1-k)/.3:1; const sc=k<.15?k/.15:1; ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(sc,sc);
    rr(ctx,-T*.62,-T*.24,T*1.24,T*.48,T*.24);ctx.fillStyle='#2d1c23';ctx.fill(); ctx.beginPath();ctx.moveTo(-T*.1,T*.22);ctx.lineTo(0,T*.38);ctx.lineTo(T*.1,T*.22);ctx.fill();
    ctx.fillStyle='#fff';ctx.font=`900 ${T*.3}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Psst!',0,T*.01);ctx.restore();}
  if(f.t==='tell'){const a=dispPos(f.c),b=dispPos(f.to); const x=(cx(a.x)+cx(b.x))/2, y=(cy(a.y)+cy(b.y))/2-T*.9-k*T*.2; ctx.save();ctx.globalAlpha=k>.8?(1-k)/.2:1;
    rr(ctx,x-T*.5,y-T*.32,T,T*.62,T*.22);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#2d1c23';ctx.lineWidth=2;ctx.stroke(); ctx.beginPath();ctx.moveTo(x-T*.1,y+T*.28);ctx.lineTo(x-T*.2,y+T*.46);ctx.lineTo(x+T*.05,y+T*.29);ctx.fillStyle='#fff';ctx.fill();
    drawIcon(ctx,L.objById[f.o].icon,x-T*.12,y,T*.42); ctx.fillStyle='#d64550';ctx.font=`900 ${T*.36}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',x+T*.27,y);ctx.restore();}
  if(f.t==='rewind'){ctx.save();ctx.globalAlpha=(1-k)*.35;ctx.fillStyle='#bde0fe';ctx.fillRect(0,0,W,H);ctx.restore();}
}
function drawHand(now){const t=(now-hand.t0)/1000; let x,y,press=0;
  if(hand.t==='tap'||hand.t==='btn'){x=hand.x;y=hand.y;press=(Math.sin(t*5)+1)/2;}
  else{const ph=(t%2.2)/2.2; const e=ph<.25?0:ph>.75?1:(ph-.25)/.5; x=cx(hand.fx+(hand.tx-hand.fx)*e);y=cy(hand.fy+(hand.ty-hand.fy)*e); press=ph<.2||(ph>.75&&ph<.9)?1:0;}
  ctx.save();ctx.translate(x+T*.12,y+T*.18+(1-press)*T*.15);ctx.scale(T/40,T/40);
  if(press>.6){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-4,-16,10+press*6,0,7);ctx.stroke();}
  ctx.fillStyle='#fff';ctx.strokeStyle='#2d1c23';ctx.lineWidth=2.2;ctx.beginPath();
  ctx.moveTo(-8,-18);ctx.quadraticCurveTo(-4,-24,0,-18);ctx.lineTo(0,-2);ctx.lineTo(4,-4);ctx.quadraticCurveTo(8,-6,9,-2);ctx.lineTo(12,-2);ctx.quadraticCurveTo(16,-3,16,2);ctx.lineTo(16,14);ctx.quadraticCurveTo(14,24,4,24);ctx.lineTo(-4,24);ctx.quadraticCurveTo(-12,22,-14,12);ctx.lineTo(-17,4);ctx.quadraticCurveTo(-18,-1,-12,0);ctx.lineTo(-8,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
function drawGoal(c,L,h){const dpr=Math.min(2,devicePixelRatio||1); const n=L.goal.length; c.width=(h*n+4)*dpr;c.height=h*dpr;c.style.width=(h*n+4)+'px';c.style.height=h+'px'; const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,999,99);
  L.goal.forEach((tk,i)=>{const x=h*i+h/2+2,y=h/2; if(tk.startsWith('face:')){const cd=L.charById[tk.slice(5)]; g.save();drawChar(g,cd,x,y+h*.28,h*1.05,'d',null,0,0);g.restore();}
    else if(['q','arrow','eyes2'].includes(tk)) drawIcon(g,tk,x,y,h*.9); else if(tk==='hat'||tk==='bench') drawFurn(g,tk,x,y,h*.9,null,true); else drawIcon(g,tk,x,y,h*.85);});}
// ---------- overlays ----------
function hideOv(){for(const id of ['win','fail','menu']) $(id).classList.remove('on'); $('big').classList.remove('on');}
function banner(a,b){const el=$('ban');el.innerHTML=`<b>${a}</b><span>${b}</span>`;el.classList.remove('on');void el.offsetWidth;el.classList.add('on');}
function starsFor(){const L=G.L; let s=3; if(G.S.steps>L.par) s--; if(G.hint) s--; return Math.max(1,s);}
function shareText(){const L=G.L; const n=G.S.steps; const st=starsFor(); return `${L.victim} in ${n} ${n===1?'Zug':'Zügen'} ausgetrickst ${'★'.repeat(st)}${'☆'.repeat(3-st)} · Psst! ${L.daily?'Tagesrätsel '+DATE:'Level '+(G.idx+1)}\n${location.href.split('#')[0]}`;}
function onWin(){const st=starsFor(); save.stars[G.L.id]=Math.max(save.stars[G.L.id]||0,st); persist(); snd('win');
  const big=$('big'); big.textContent=G.L.id==='zauber'?'Ta-da!':'Überraschung!'; big.classList.remove('on');void big.offsetWidth;big.classList.add('on');
  for(let i=0;i<160;i++) conf.push({x:W/2+(Math.random()-.5)*60,y:H*.42,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:['#e4572e','#f4c95d','#3a86ff','#2a9d8f','#f7c6c7','#7b6cd9'][i%6]});
  setTimeout(()=>{ if(!G.S.done) return; $('wstars').innerHTML=[0,1,2].map(i=>`<i class="${i<st?'y':''}">★</i>`).join(''); const n=G.S.steps;
    $('wtext').textContent=`${G.L.victim} in ${n} ${n===1?'Zug':'Zügen'} ausgetrickst`; $('wsub').textContent=st<3?(G.hint?'Ohne Tipp gibt’s mehr Sterne':'Bestwert: '+G.L.par+' Züge'):'Perfekt!';
    $('bnext').textContent=G.idx+1<LEVELS.length?(LEVELS[G.idx+1].daily?'Weiter: Tagesrätsel':'Weiter'):'Menü';
    drawGoal($('wgoal'),G.L,44); $('win').classList.add('on');},1700);}
function onFail(){const w=G.S.why||''; const L=G.L; let txt='Das hat nicht geklappt.';
  const m=w.split(':'); const nm=id=>(L.charById[id]||{}).name||id;
  if(m[0]==='found') txt=`${nm(m[1])} hat ${OBJN[m[2]]||m[2]} gefunden.`; else if(m[0]==='giveup') txt=`${nm(m[1])} gibt die Suche auf.`;
  else if(w==='see:papa:deko:hook') txt='Papa hat die Deko gesehen – er verplappert sich!'; else if(w==='lisa_home') txt='Lisa ist da – aber nichts hängt.'; else if(w==='time') txt='Die Zeit ist um.';
  $('ftext').textContent=txt; $('fail').classList.add('on');}
function drawHero(){const c=$('hero'),dpr=Math.min(2,devicePixelRatio||1),w=Math.min(320,innerWidth*.86),h=w*.52; c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0); const t=w/6.2;
  g.fillStyle='#f1dfc4';rr(g,0,0,w,h,18);g.fill(); g.fillStyle='#c98b5b';rr(g,t*.3,t*.25,w-t*.6,t*.75,10);g.fill();g.fillStyle='#e8d5bf';rr(g,t*.3,t*.25,w-t*.6,t*.28,10);g.fill();
  drawFurn(g,'jar',t*1.3,t*.62,t,'A'); drawFurn(g,'jar',w-t*1.3,t*.62,t,'B'); drawIcon(g,'cookie',w-t*1.3,t*.68,t*.5); drawIcon(g,'cookie',t*1.3,t*.62,t*.62,'#e4572e');
  g.save();g.strokeStyle='rgba(228,87,46,.6)';g.lineWidth=2;g.setLineDash([2,5]);g.beginPath();g.moveTo(w/2-t*.2,h-t*1.75);g.lineTo(t*1.3,t*.9);g.stroke();g.restore();
  drawChar(g,{col:'#e4572e',hair:'#5b3a29',kid:true},w/2,h-t*.55,t*1.1,'ul',null,0,0);
  const bx=w/2-t*.1,by=h-t*1.75; g.fillStyle='#fffaf2';g.strokeStyle='#e4572e';g.lineWidth=2.5;g.beginPath();for(const [dx,dy,r] of [[-.4,0,.36],[.05,-.12,.4],[.42,.04,.34],[0,.14,.38]]){g.moveTo(bx+dx*t*1.2+r*t*.9,by+dy*t*.9);g.arc(bx+dx*t*1.2,by+dy*t*.9,r*t*.9,0,7);}g.stroke();g.fill();
  drawFurn(g,'jar',bx+t*.22,by+t*.08,t*.55,'A',true); drawIcon(g,'cookie',bx-t*.25,by-t*.04,t*.5,'#e4572e');
  g.save(); g.translate(w-t*.55,h-t*.6); g.fillStyle='#d64550';g.beginPath();g.moveTo(-t*.25,t*.15);g.quadraticCurveTo(0,-t*.5,t*.3,-t*.42);g.lineTo(t*.25,t*.15);g.closePath();g.fill();g.fillStyle='#fff';g.beginPath();g.arc(t*.3,-t*.42,t*.07,0,7);g.fill();g.restore();}
function openMenu(){ drawHero(); const g=$('lv'); g.innerHTML=''; LEVELS.forEach((L,i)=>{const b=document.createElement('button'); const st=save.stars[L.id]||0; b.className='lvb'+(L.daily?' daily':'');
    b.innerHTML=`<em>${L.daily?'Tagesrätsel':(i+1)}</em><b>${L.daily?DATE:L.name}</b><span>${[0,1,2].map(k=>k<st?'★':'☆').join('')}</span>`; b.onclick=()=>startLevel(i); g.appendChild(b);});
  $('snd').textContent=save.snd?'Ton: an':'Ton: aus'; $('resume').style.display=G?'':'none'; $('menu').classList.add('on');}
$('menuB').onclick=openMenu; $('resume').onclick=()=>$('menu').classList.remove('on');
$('play').onclick=()=>{const i=LEVELS.findIndex(L=>!save.stars[L.id]); startLevel(i<0?0:i);};
$('snd').onclick=()=>{save.snd=!save.snd;persist();$('snd').textContent=save.snd?'Ton: an':'Ton: aus'; snd('found');};
$('undo').onclick=undo; $('wait').onclick=wait1; $('ff').onclick=ff; $('hint').onclick=hint;
$('fundo').onclick=undo; $('fre').onclick=()=>startLevel(G.idx); $('bretry').onclick=()=>startLevel(G.idx);
$('bnext').onclick=()=>{ if(G.idx+1<LEVELS.length) startLevel(G.idx+1); else {hideOv();openMenu();}};
$('bshare').onclick=async()=>{const t=shareText(); window.PSST.lastShare=t; try{ if(navigator.share){await navigator.share({text:t}); return;} }catch(e){}
  try{await navigator.clipboard.writeText(t); toast('Kopiert!');}catch(e){ const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Kopiert!');}catch(e2){toast(t);} ta.remove();}};
function toast(t){const el=$('toast');el.textContent=t;el.classList.remove('on');void el.offsetWidth;el.classList.add('on');}
addEventListener('resize',resize);
document.addEventListener('keydown',e=>{if(e.key===' ')wait1(); if(e.key==='z')undo(); if(e.key==='f')ff();});
// pars (computed by solver at build time)
const PARS={keks:7,brille:17,schere:10,party:18,zauber:14,tratsch:27}; for(const L of LEVELS) L.par=PARS[L.id];
window.PSST={E,LEVELS,get G(){return G;},start:startLevel,act:doAct,ff,undo,hint,wait:wait1,shareText,lastShare:null,get busy(){return busy;},
  tile:(x,y)=>({x:cx(x),y:cy(y)})};
resize(); requestAnimationFrame(render); openMenu();

</script></body></html>
