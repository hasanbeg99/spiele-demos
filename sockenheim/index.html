};

/* ---------- Audio (alles synthetisch) ---------- */
const AU={ac:null,master:null,mute:false,last:{},
 init(){if(this.ac)return;try{const A=window.AudioContext||window.webkitAudioContext;this.ac=new A();this.master=this.ac.createGain();this.master.gain.value=this.mute?0:.55;this.master.connect(this.ac.destination);const b=this.ac.createBuffer(1,this.ac.sampleRate*1.5,this.ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.noise=b;}catch(e){this.ac=null}},

 nz(dur,vol=.2,freq=800,q=1,delay=0,type='bandpass'){if(!this.ac||this.mute)return;const t=this.ac.currentTime+delay,s=this.ac.createBufferSource(),f=this.ac.createBiquadFilter(),g=this.ac.createGain();s.buffer=this.noise;f.type=type;f.frequency.value=freq;f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(this.master);s.start(t,Math.random());s.stop(t+dur+.02)},

const SW=48,SH=56,SS=3; // Sprite-Basisgröße, Supersampling
function sockPath(c){c.beginPath();c.moveTo(7,4);c.lineTo(27,4);c.lineTo(27,33);c.quadraticCurveTo(27.5,37.5,32,38);c.lineTo(39,38);c.arc(39.5,45,7,-Math.PI/2,Math.PI/2);c.lineTo(15,52);c.quadraticCurveTo(5.5,52,6.2,42);c.closePath()}
const sockSpr=[];
function makeSockSprite(t){
 const p=Math.floor(t/3),C=COL[t%3],cnv=document.createElement('canvas');cnv.width=SW*SS;cnv.height=SH*SS;const c=cnv.getContext('2d');c.scale(SS,SS);
 const base=p===7?CREAM:C.c;

 if(p===5){c.strokeStyle=C.d;c.lineWidth=.9;for(let x=4;x<48;x+=4)for(let y=10;y<56;y+=3.4){const s=(Math.floor(x/4)%2)?1:-1;c.beginPath();c.moveTo(x,y);c.lineTo(x+2,y+1.7*s);c.stroke()}}
 if(p===6){c.fillStyle=CREAM;c.fillRect(0,15,48,10);c.fillStyle=C.d;for(let x=2;x<48;x+=6){c.beginPath();c.moveTo(x,20);c.lineTo(x+3,16.5);c.lineTo(x+6,20);c.lineTo(x+3,23.5);c.fill()}c.fillStyle=C.c;for(let x=5;x<48;x+=6)c.fillRect(x-.6,17,1.2,6);c.fillStyle=CREAM;for(let y=30;y<56;y+=6)for(let x=(y%12?3:6);x<48;x+=6)c.fillRect(x,y,1.4,1.4)}
 if(p===7){c.fillStyle=C.c;c.fillRect(0,12,48,2.6);c.fillRect(0,16.5,48,2.6)}
 // Ferse & Spitze
 c.fillStyle=p===7?'#cdbfa3':C.d;c.globalAlpha=.85;c.beginPath();c.arc(9,48.5,7.5,0,TAU);c.fill();c.beginPath();c.rect(37.5,30,14,30);c.fill();c.globalAlpha=1;
 // Bündchen

function genWash(n){
 const q=[];
 const nS=n===1?3:ri(3,5),nK=ri(8,15),nL=n<=2?5:ri(2,5),nH=n<=2?3:ri(1,3);
 const socks=[];
 if(n>=2){
  // Zwillings-Garantie ab Waschgang 2 + Mitleids-Bonus (+10 % pro Waschgang je Einzelsocke)
  const types=new Map();S.units.forEach(u=>u.s.forEach(s=>types.set(s.t,(types.get(s.t)||0)+1)));
  const singles=[];S.units.forEach(u=>{if(u.s.length===1&&types.get(u.s[0].t)===1)singles.push(u.s[0])});
  singles.sort((a,b)=>(b.w||0)-(a.w||0));
  const twinOf=new Set();
  if(singles.length){twinOf.add(singles[0].t)}
  for(const s of singles){if(twinOf.size>=nS)break;if(!twinOf.has(s.t)&&Math.random()<.1*(s.w||0))twinOf.add(s.t)}
  for(const s of singles){if(twinOf.has(s.t))s.w=0;else s.w=(s.w||0)+1}
  twinOf.forEach(t=>socks.push(mkSock(t)));
 }
 while(socks.length<nS)socks.push(mkSock());
 socks.forEach(s=>q.push({k:'sock',sock:s}));
 for(let i=0;i<nK;i++)q.push({k:'k',col:pick(KCOL)});
 for(let i=0;i<nL;i++)q.push({k:'l',col:pick(LCOL)});
 for(let i=0;i<nH;i++)q.push({k:'h',col:pick(HCOL)});
 if(Math.random()<.15)q.push({k:'rare',rk:pick(Object.keys(RARE))});
 // mischen, Socken eher zur Mitte hin
 for(let i=q.length-1;i>0;i--){const j=ri(0,i);[q[i],q[j]]=[q[j],q[i]]}
 return q;
}

 G.combo=0;goArea(0);AU.rumbleOn();
 toast(pick(['Schleudergang. Bitte festhalten.','Die Trommel dreht sich. Oben flucht jemand über eine fehlende Socke.','Waschgang läuft. Fangen, was rausfliegt!','1400 Umdrehungen. Hier unten nennen wir das Lieferung.']));
}

 if(w.ph==='wind'){w.spd=Math.min(14,w.spd+dt*14);G.shake=Math.max(G.shake,1.2);if(w.t>1.1){w.ph='eject';w.t=0}}
 else if(w.ph==='eject'){G.shake=Math.max(G.shake,1.6);const iv=2.8/w.queue.length;w.nextEj-=dt;while(w.nextEj<=0&&w.ej<w.queue.length){ejectItem(w.queue[w.ej++]);w.nextEj+=iv}if(w.ej>=w.queue.length&&w.nextEj<-.4){w.ph='close';w.t=0;AU.rumbleOff()}}
 else if(w.ph==='close'){w.spd=Math.max(0,w.spd-dt*20);if(w.t>.9){G.wash=null;S.washAt=Date.now()+washInterval();if(G.combo>=3)toast(`Fang-Serie: ${G.combo}. Respekt, Herr Bürgermeister.`);save()}}
 w.spin+=w.spd*dt;
}

/* ---------- Einsammeln & Fangen ---------- */
function scr(x,y){return [x-G.cam,y]}
function flyTo(it,tx,ty,dur,cb){const [sx,sy]=scr(it.x,it.y);G.flyers.push({it,x:sx,y:sy,tx,ty,t:0,dur,cb})}
function grant(it,mult,caught){
 let txt='';
 if(it.k==='sock'){
  const u=addUnit(it.sock);
  const hut=S.b.find(b=>b.type==='huette'&&b.area===G.area);
  if(caught){
   if(hut&&sockCount()<=housing()){const p=bPos(hut);flyTo(it,p.x-G.cam,p.y-L.bs*.15,.55,()=>{burst(p.x,p.y-L.bs*.2,10,'rgba(255,215,140,');AU.squeak()});u.fresh=1;txt='Direkt eingezogen!';}
   else{addRes('k',1);const t=traySlotPos(S.units.filter(v=>v.b==null).indexOf(u));flyTo(it,t[0],t[1],.55);txt='+1 Knopf Fangprämie'}
  } else {const t=traySlotPos(S.units.filter(v=>v.b==null).indexOf(u));flyTo(it,t[0],t[1],.5)}
  floatText(it.x,it.y-30,`${it.sock.n} ${pick(ARRIVE)}`,'#f3e2bd',0,1.9);
  if(txt)floatText(it.x,it.y-50,txt,'#ffd27a',1);
 } else if(it.k==='rare'){
  const R=RARE[it.rk];S.rare++;for(const r in R.g)addRes(r,R.g[r]);if(caught)addRes('k',1);
  flyTo(it,L.chips.k[0],L.chips.k[1],.6);toast(R.txt);floatText(it.x,it.y-20,R.n+'!','#ffd27a',1);
 } else {
  const n=caught?2:1,got=addRes(it.k,n,!caught&&false);
  flyTo(it,L.chips[it.k][0],L.chips[it.k][1],.5+Math.random()*.15);
  if(caught)floatText(it.x,it.y-16,`+${n}`,'#ffd27a',1);
 }
}
function catchItem(it){
 it.st='gone';G.combo++;S.caught=(S.caught||0)+1;AU.catch_(G.combo-1);
 burst(it.x,it.y,12,'rgba(255,220,150,');G.parts.push({x:it.x,y:it.y,t:0,life:.35,kind:'ring',r:6});
 grant(it,2,true);
 if(G.combo>1)floatText(it.x+14,it.y-4,`Gefangen ×${G.combo}`,'#fff',1);
}
function collectItem(it,i=0){it.st='gone';AU.collect(i);burst(it.x,it.y,5,'rgba(240,225,195,');grant(it,1,false)}
function claimFund(){
 const f=S.fund,tot=f.k+f.h+f.l+f.socks.length+f.rare.length;if(!tot){toast('Die Fundkiste ist leer. Wie die Versprechen des Vermieters.');AU.err();return}
 AU.box();G.boxBump=1;const p=[L.fund.x+L.fund.w/2,L.fund.y+L.fund.h/2];
 for(const r of ['k','h','l'])if(f[r]){addRes(r,f[r]);for(let i=0;i<Math.min(f[r],6);i++)G.flyers.push({it:{k:r,col:r==='k'?pick(KCOL):r==='l'?pick(LCOL):pick(HCOL),rot:0},x:p[0]-G.cam,y:p[1],tx:L.chips[r][0],ty:L.chips[r][1],t:-i*.05,dur:.55})}
 f.socks.forEach(s=>addUnit(s));f.rare.forEach(k=>{S.rare++;for(const r in RARE[k].g)addRes(r,RARE[k].g[r])});
 floatText(p[0],p[1]-20,`Fundkiste geleert (${tot})`,'#f3e2bd',1);
 S.fund={k:0,h:0,l:0,socks:[],rare:[]};save();

function updItems(dt){
 for(const it of G.items){
  if(it.st==='fly'){
   it.sc=Math.min(1,it.sc+dt*5);it.vy+=it.g*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;it.rot+=it.vr*dt;
   if(!it.dry){if(it.x<16){it.x=16;it.vx=Math.abs(it.vx)*.5}if(it.x>W-16){it.x=W-16;it.vx=-Math.abs(it.vx)*.5}}
   if(it.y>=it.gy&&it.vy>0){it.y=it.gy;if(it.vy>260){it.sqv=it.vy*.004;it.vy=-it.vy*.36;it.vx*=.55;it.vr*=.5;AU.land();dustPuff(it.x,it.y)}else{it.st='floor';it.tl=G.t;it.vx=0;it.vy=0;if(it.k==='sock'){it.wobv=it.rot*-6}}}
  } else if(it.st==='floor'){
   if(it.k==='sock'){it.wobv+=(-it.rot*90-it.wobv*7)*dt;it.rot+=it.wobv*dt}
   if(G.t-it.tl>20){it.st='roll';it.t0=G.t;it.fx=it.x;it.fy=it.y}
  } else if(it.st==='roll'){
   const tt=clamp((G.t-it.t0)/.8,0,1),e=easeIO(tt);it.x=lerp(it.fx,L.fund.x+L.fund.w/2,e);it.y=lerp(it.fy,L.fund.y+L.fund.h*.3,e)-Math.sin(tt*Math.PI)*30;it.rot+=dt*10;
   if(tt>=1){it.st='gone';if(it.k==='sock')S.fund.socks.push(it.sock);else if(it.k==='rare')S.fund.rare.push(it.rk);else S.fund[it.k]++;G.boxBump=1;AU.thr('roll',300)&&AU.box();
    if(!G.rollMsg||G.t-G.rollMsg>15){G.rollMsg=G.t;toast('Liegengebliebenes rollt in die Fundkiste. Ordnung muss sein.')}}
  }
  // Squash-Feder
  it.sqv+=(-it.sq*260-it.sqv*12)*dt;it.sq+=it.sqv*dt;
 }
 G.items=G.items.filter(i=>i.st!=='gone');
 for(const f of G.flyers){f.t+=dt}
 G.flyers=G.flyers.filter(f=>{if(f.t>=f.dur){if(f.cb)f.cb();if(f.it&&f.it.k&&f.it.k!=='sock'){AU.thr('ding',50)&&(f.it.k==='k'?AU.coin():null)}return false}return true});
}

function floatText(x,y,txt,col,big,life=1.3){G.floats.push({x,y,txt,col,big,t:0,life})}
function updParts(dt){
 for(const p of G.parts){p.t+=dt;if(p.kind==='spark'||p.kind==='conf'){p.vy+=(p.kind==='conf'?220:300)*dt;p.vx*=.98}if(p.kind==='puff'||p.kind==='bub'){p.vx*=.95;p.vy*=.95}if(p.vx!=null){p.x+=p.vx*dt;p.y+=p.vy*dt}if(p.vr)p.rot+=p.vr*dt}
 G.parts=G.parts.filter(p=>p.t<p.life);
 for(const f of G.floats)f.t+=dt;G.floats=G.floats.filter(f=>f.t<f.life);
 for(const d of G.dust){d.ph+=dt;d.x+=(d.vx+Math.sin(d.ph*.7)*3)*dt;d.y+=(d.vy+Math.cos(d.ph*.5)*2)*dt;if(d.y<L.top-40)d.y=L.trayTop;if(d.y>L.trayTop)d.y=L.top-40;if(d.x<0)d.x=W*2;if(d.x>W*2)d.x=0}

/* ---------- Gebäude ---------- */
function bPos(b){if(b.type==='bruecke')return{x:W,y:L.bridge.y};const p=L.plots[b.plot];return{x:p.x+b.area*W,y:p.y}}
function freePlot(area){for(let i=0;i<L.plots.length;i++)if(!S.b.some(b=>b.area===area&&b.plot===i&&b.type!=='bruecke'))return i;return -1}
function bRect(b){const p=bPos(b),s=L.bs;if(b.type==='bruecke')return{x0:W*.84,x1:W*1.16,y0:L.bridge.y-40,y1:L.bridge.y+16};return{x0:p.x-s*.46,x1:p.x+s*.46,y0:p.y-s*.9,y1:p.y+6}}
function buildCheck(type){
 const d=BD[type];
 if(!d.multi&&has(type))return 'Schon gebaut';
 if(d.need&&pairsNow()<d.need&&!has(type))return `Ab ${d.need} Paaren (du hast ${pairsNow()})`;
 if(type!=='bruecke'){let ok=false;for(let a=0;a<2;a++)if(S.unl[a]&&freePlot(a)>=0)ok=true;if(!ok)return 'Kein freier Bauplatz';}
 if(!canAfford(d.cost))return 'Zu wenig Material';
 return '';
}
function build(type){
 const why=buildCheck(type);if(why){toast(why);AU.err();return false}
 const d=BD[type];S.res.k-=d.cost.k||0;S.res.h-=d.cost.h||0;S.res.l-=d.cost.l||0;
 let area=G.area,plot=-1;
 if(type!=='bruecke'){plot=freePlot(area);if(plot<0){area=area?0:1;plot=freePlot(area)}}else area=0;
 const b={id:S.uid++,type,area,plot,acc:0,born:Date.now()};S.b.push(b);b.pop=G.t;
 const p=bPos(b);
 if(area!==G.area&&type!=='bruecke')goArea(area);
 AU.build();G.shake=6;dustPuff(p.x,p.y);dustPuff(p.x-20,p.y);dustPuff(p.x+20,p.y);lintConfetti(p.x,p.y-L.bs*.4,22);
 floatText(p.x,p.y-L.bs*.9,d.n+' gebaut','#ffe2a6',1,1.6);
 if(type==='bruecke'){S.unl[1]=1;setTimeout(()=>{goArea(1);openDryer()},900)}
 refreshHUD();save();return true;
}
function openDryer(){
 if(S.dryerLoot)return;S.dryerLoot=1;
 toast('Unter dem Trockner. Hier war seit 2014 niemand. Es liegt einiges herum.');
 const loot=[...Array(5)].map(()=>({k:'l',col:pick(LCOL)})).concat([...Array(3)].map(()=>({k:'h',col:pick(HCOL)})),[{k:'rare',rk:'muenze'}]);
 loot.forEach((q,i)=>{const it=Object.assign({x:W+rnd(30,W-30),y:L.floorY-40,vx:0,vy:0,g:1150,gy:rnd(L.floorY+16,L.trayTop-14),rot:rnd(0,TAU),vr:rnd(-6,6),st:'fly',dry:1,sq:0,sqv:0,wob:0,wobv:0,sc:1},q);it.vy=-rnd(50,200);G.items.push(it)});
}
function updProd(dt){
 for(const b of S.b){const r=prodRate(b);if(!r)continue;b.acc=(b.acc||0)+r*dt;while(b.acc>=1){b.acc-=1;if(S.res.k>=cap()){b.acc=0;break}addRes('k',1,true);const p=bPos(b);floatText(p.x+L.bs*.2,p.y-L.bs*.7,'+1','#ffd27a',0,.9);
   if(Math.abs(p.x-G.cam-W/2)<W)G.flyers.push({it:{k:'k',col:pick(KCOL),rot:0},x:p.x-G.cam-L.bs*.22,y:p.y-L.bs*.62,tx:L.chips.k[0],ty:L.chips.k[1],t:0,dur:.7});AU.coin()}}
}
function offlineGain(){
 const dt=Math.min(OFFLINE_CAP,Math.max(0,Date.now()-(S.lastT||Date.now())));if(dt<5000)return;
 let tot=0;for(const b of S.b){const r=prodRate(b);if(!r)continue;const g=r*dt/1000+(b.acc||0);const n=Math.floor(g);b.acc=g-n;tot+=n}
 const got=tot?addRes('k',tot,true):0;
 const capped=Date.now()-S.lastT>OFFLINE_CAP;
 if(got||capped)setTimeout(()=>toast(`Willkommen zurück. Während du weg warst: +${got} Knöpfe${capped?' (gezählt werden höchstens 2 Stunden. Erholung ist wichtig.)':'.'}`),600);

/* ---------- Wartebank (Tray) ---------- */
function trayUnits(){return S.units.filter(u=>u.b==null)}
function trayGeom(){const n=Math.max(1,trayUnits().length),T=L.tray,top=T.y+16,h=T.h-18,rows=2,rowH=h/rows;let slot=Math.min(rowH*1.0,52);let cols=Math.floor((T.w-10)/slot);if(cols*rows<n){cols=Math.ceil(n/rows);slot=(T.w-10)/cols}return{top,rowH,slot,cols}}
function traySlotPos(i){const g=trayGeom(),c=i%g.cols,r=Math.floor(i/g.cols);return[L.tray.x+6+g.slot*(c+.5),g.top+g.rowH*(r+1)-4]}
function homelessSet(){const free=housing()-assignedSocks();let acc=0;const hs=new Set();for(const u of trayUnits()){acc+=u.s.length;if(acc>free)hs.add(u.id)}return hs}
function trayHit(x,y){if(y<L.tray.y||y>L.tray.y+L.tray.h)return null;const tu=trayUnits(),g=trayGeom();for(let i=0;i<tu.length;i++){const [px,py]=traySlotPos(i);if(Math.abs(x-px)<g.slot*.5&&y>py-g.rowH&&y<py+6)return tu[i]}return null}
function tryPair(a,b){
 if(a.s.length!==1||b.s.length!==1||a.s[0].t!==b.s[0].t){AU.err();toast(pick(['Ähnlich ist nicht gleich. Fragen Sie jeden, der schon mal Socken sortiert hat.','Das ist nicht mal annähernd dieselbe Socke.','Gegensätze ziehen sich an. Socken nicht.']));G.shakeUnit={id:b.id,t:G.t};return false}
 a.s.push(b.s[0]);S.units=S.units.filter(u=>u!==b);S.pairs++;a.pairT=G.t;
 const i=trayUnits().indexOf(a),[px,py]=traySlotPos(i);
 AU.pair();lintConfetti(px,py-30,40);G.shake=4;
 const first=S.pairs===1;const bonus=first?10:5;addRes('k',bonus);
 floatText(px+G.cam,py-50,first?'Erstes Paar! Wiedervereint.':'Wiedervereint.','#ffe2a6',1,1.8);
 floatText(px+G.cam,py-30,`+${bonus} Knöpfe Wiedersehensgeld`,'#ffd27a',0,1.8);
 toast(pick(['Wiedervereint. Nach Jahren in verschiedenen Schubladen.','Ein Paar. Zählt im Gebäude als 1,5 Arbeiter. Liebe macht produktiv.','Sie haben sich wiedergefunden. Ohne Dating-App.']));
 if(pairsNow()===3&&!has('zwilling'))setTimeout(()=>toast('3 Paare! Das Zwillingshaus ist jetzt freigeschaltet.'),1500);
 refreshHUD();save();return true;
}
function assign(u,b){

 const n=S.units.filter(v=>v.b===b.id).length;if(n>=2){AU.err();toast('Die Werkstatt ist voll. Zwei Arbeiter, mehr verträgt die Schublade nicht.');return false}
 if(assignedSocks()+u.s.length>housing()){AU.err();toast('Kein Wohnraum. Erst eine Fusselhütte bauen. Willkommen auf dem Mietmarkt.');return false}
 u.b=b.id;const p=bPos(b);AU.build();burst(p.x,p.y-L.bs*.3,14,'rgba(255,215,140,');floatText(p.x,p.y-L.bs*.95,`${u.s[0].n}${u.s.length>1?' & '+u.s[1].n:''} arbeitet jetzt`,'#f3e2bd',0,1.6);

/* ---------- Rendern ---------- */
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function drawItem(c,it){
 const sq=clamp(it.sq,-.4,.5),sx=1+sq*.6,sy=1-sq,big=it.st==='fly'?1.25*it.sc:1;
 if(it.k==='sock'){
  const look=[(G.ptr[0]+G.cam-it.x)/60,(G.ptr[1]-it.y)/80];
  drawSock(c,it.sock,it.x,it.y,.72*big,it.rot,sx,sy,{shock:it.st==='fly',look:it.st==='floor'?look:null});
 } else {
  c.save();c.translate(it.x,it.y);c.scale(sx*big,sy*big);
  if(it.k==='k')drawKnopf(c,0,-6,7.5,it.col,it.rot);else if(it.k==='l')drawLego(c,0,-6,15,it.col,it.rot*.3);else if(it.k==='h')drawGummi(c,0,-6,7.5,it.col,it.rot);else drawRare(c,it.rk,0,-7,15,it.rot*.2);
  c.restore();
 }
 if(it.st==='fly'&&G.t%0.4<.2&&S.tut<3){c.strokeStyle='rgba(255,230,160,.5)';c.lineWidth=1.5;c.beginPath();c.arc(it.x,it.y-10,22,0,TAU);c.stroke()}

function drawPorthole(c){
 const w=G.wash,x=L.px,y=L.py,r=L.pr;
 if(!w){
  // geschlossene Klappe

  c.strokeStyle='rgba(0,0,0,.08)';for(let i=4;i<r;i+=3){c.beginPath();c.arc(x,y,i,0,TAU);c.stroke()}
  c.fillStyle='#5f594f';c.font=`600 ${Math.round(r*.16)}px Georgia`;c.textAlign='center';c.textBaseline='middle';c.fillText('SERVICE',x,y-r*.1);c.font=`italic ${Math.round(r*.13)}px Georgia`;c.fillText('nur für Socken',x,y+r*.12);
 } else {

   if(q.k==='sock')drawSock(c,q.sock,ix,iy+12,.5,a+1.5,1,1,{shock:true});else if(q.k==='k')drawKnopf(c,ix,iy,5.5,q.col,a);else if(q.k==='l')drawLego(c,ix,iy,11,q.col,a);else if(q.k==='h')drawGummi(c,ix,iy,5.5,q.col,a);else drawRare(c,q.rk,ix,iy,11,a)});
  // Wasser + Schaum
  const lv=y+r*.35+Math.sin(w.t*9)*3;c.fillStyle='rgba(120,170,200,.35)';c.beginPath();c.moveTo(x-r,y+r);for(let i=0;i<=20;i++){const xx=x-r+i*r/10;c.lineTo(xx,lv+Math.sin(i*.9+w.t*12)*4)}c.lineTo(x+r,y+r);c.fill();
  c.fillStyle='rgba(240,245,250,.6)';for(let i=0;i<14;i++){c.beginPath();c.arc(x-r+((i*37+w.t*80)%(r*2)),lv+Math.sin(i+w.t*7)*4,rnd(2,5),0,TAU);c.fill()}
  // Glas
  const g=c.createLinearGradient(x-r,y-r,x+r,y+r);g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(.4,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.08)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);
  c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=3;c.beginPath();c.arc(x,y,r*.82,3.6,4.4);c.stroke();
  c.restore();
  c.strokeStyle='#5a554c';c.lineWidth=4;c.beginPath();c.arc(x,y,r,0,TAU);c.stroke();
  // Klappe schwenkt auf
  if(w.ph==='wind'&&w.t<.5){const k=1-w.t/.5;c.save();c.translate(x-r,y);c.scale(k,1);c.fillStyle='#bdb6a6';c.beginPath();c.arc(r,0,r,0,TAU);c.fill();c.restore()}
  if(w.ph==='close'&&w.t>.4){const k=clamp((w.t-.4)/.4,0,1);c.save();c.translate(x-r,y);c.scale(k,1);c.fillStyle='#bdb6a6';c.beginPath();c.arc(r,0,r,0,TAU);c.fill();c.restore()}
  if(w.ph==='eject'&&S.tut<3){c.fillStyle='rgba(255,230,160,'+(.6+.4*Math.sin(G.t*10))+')';c.font='italic 700 15px Georgia';c.textAlign='center';c.fillText('Fangen!',x,y-r-10)}
 }

 for(const t of BORDER){if(t==='bruecke'){ICON['b_'+t]=mk((c,s)=>{for(let i=0;i<6;i++){c.strokeStyle=HCOL[i%4];c.lineWidth=3;c.beginPath();c.ellipse(6+i*7.5,s*.45+Math.sin(i/5*Math.PI)*5,4.5,2.5,0,0,TAU);c.stroke()}c.fillStyle='#e0c592';for(let i=0;i<7;i++)c.fillRect(4+i*7,s*.6+Math.sin(i/6*Math.PI)*5,3,8)},64);continue}
  const sp=bSprite(t,58);ICON['b_'+t]=mk((c,s)=>c.drawImage(sp.cnv,(s-sp.cw)/2,(s-sp.ch)/2,sp.cw,sp.ch),64)}
}
const sockThumb={};
function sockImg(s){const k=s.t+s.tr;if(sockThumb[k])return sockThumb[k];const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');drawSock(x,Object.assign({},s,{seed:2}),48,92,1.55);return sockThumb[k]=c.toDataURL()}

/* ---------- HUD ---------- */
let hudCache='';
function refreshHUD(){
 const c=cap(),sc=sockCount(),hs=housing();
 const key=[S.res.k,S.res.h,S.res.l,sc,hs,c,S.unl[1],has('bruecke')].join();if(key===hudCache)return;hudCache=key;
 for(const r of ['k','h','l']){$('#v'+r).textContent=S.res[r]+'/'+c;$('#c'+r).classList.toggle('full',S.res[r]>=c)}
 
 $('#vs').textContent=`${sc}/${hs}`;$('#cs').classList.toggle('full',sc>hs);
 $('#t1').textContent=S.unl[1]?'Trockner':'Trockner 🔒';$('#t1').classList.toggle('lock',!S.unl[1]);
 $('#t2').textContent=sc>=10?'Bett ✦':`Bett 🔒 ${Math.min(sc,10)}/10`;$('#t2').classList.toggle('lock',sc<10);
}

function goArea(a){if(a===1&&!S.unl[1]){toast('Zum Trockner kommt man nur über die Gummiseil-Brücke.');AU.err();return}G.area=a;['t0','t1'].forEach((id,i)=>$('#'+id).classList.toggle('on',i===a))}

/* ---------- Toasts ---------- */
function toast(msg){const box=$('#toasts');while(box.children.length>1)box.firstChild.remove();const d=document.createElement('div');d.className='toast';d.textContent=msg;box.appendChild(d);setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),450)},Math.min(5200,2200+msg.length*28))}

/* ---------- Sheets ---------- */
const sheet=$('#sheet'),veil=$('#veil');
function openSheet(kind,html){G.sheet=kind;sheet.innerHTML='<button class="x" data-close>✕</button>'+html;sheet.classList.add('open');veil.style.display='block';sheet.scrollTop=0}
function closeSheet(){G.sheet=null;sheet.classList.remove('open');veil.style.display='none'}
veil.addEventListener('click',closeSheet);
sheet.addEventListener('click',e=>{const t=e.target.closest('[data-close],[data-b],[data-rm],[data-pick],[data-act]');if(!t)return;AU.init();
 if(t.dataset.close!=null){closeSheet();return}
 if(t.dataset.b){if(build(t.dataset.b))closeSheet();else renderBuild();return}
 if(t.dataset.rm){const u=unitById(+t.dataset.rm);if(u){u.b=null;AU.squeak();toast(`${u.s[0].n} sitzt wieder auf der Wartebank. Hat keiner gefragt, warum.`);save();const b=S.b.find(x=>x.id===+t.dataset.bid);if(b)openBInfo(b)}return}
 if(t.dataset.pick){G.giftPick=+t.dataset.pick;renderTwin();return}
 const a=t.dataset.act;
 if(a==='mute'){S.mute=S.mute?0:1;AU.setMute(!!S.mute);save();renderMenu()}
 if(a==='reset'){if(confirm('Spielstand wirklich löschen? Die Socken werden es dir nicht verzeihen.')){localStorage.removeItem(KEY);G.noSave=1;location.hash='';location.reload()}}
 if(a==='tut'){S.tut=0;if(!has('huette'))S.tut=3;closeSheet()}
 if(a==='send')sendGift();
 if(a==='copy'){const i=$('#glink');i.select();try{navigator.clipboard.writeText(i.value).then(()=>toast('Link kopiert.'),()=>{document.execCommand('copy');toast('Link kopiert.')})}catch(_){document.execCommand('copy');toast('Link kopiert.')}}
 if(a==='share'){const i=$('#glink');navigator.share&&navigator.share({title:'Sockenheim',text:G.giftText,url:i.value}).catch(()=>{})}
});
function costHTML(c){return ['l','h','k'].filter(r=>c[r]).map(r=>`<span class="${S.res[r]<c[r]?'no':''}"><img src="${ICON[r]}">${c[r]}</span>`).join('')||'<span>gratis</span>'}
function openBuild(focus){renderBuild(focus)}
function renderBuild(){
 let h='<h2>Bauen</h2><div class="sub">Baumaterial: Lego, Haargummis, Knöpfe. Alles ehrlich erspielt.</div>';
 for(const t of BORDER){const d=BD[t];if(t==='bruecke'&&has('bruecke'))continue;const why=buildCheck(t);const n=count(t);
  h+=`<button class="bcard" data-b="${t}" ${why?'disabled':''} id="card_${t}"><img src="${ICON['b_'+t]}" alt=""><div style="flex:1;min-width:0"><div class="t">${d.n}${d.multi&&n?` <small style="opacity:.6">(${n}×)</small>`:''}</div><div class="e">${d.eff}</div><div class="d">${d.desc}</div><div class="c">${costHTML(d.cost)}${why?`<span style="opacity:.7;font-weight:400;font-style:italic">· ${why}</span>`:''}</div></div></button>`}
 h+=`<div class="bcard soon"><div style="width:58px;text-align:center;font-size:26px">✦</div><div><div class="t">Zusätzlicher Bautrupp · Saisonpass</div><div class="e">kommt bald</div><div class="d">In der Demo gibt es nichts zu kaufen. Auch keine Werbung.</div></div></div>`;
 openSheet('build',h);
}
function openBInfo(b){
 const d=BD[b.type];AU.click();
 let h=`<div class="row"><img src="${ICON['b_'+b.type]}" style="width:64px;height:64px"><div><h2>${d.n}</h2><div class="sub" style="margin:0">${d.eff}</div></div></div><p style="font:italic 13.5px Georgia;opacity:.8">${d.desc}</p>`;
 if(b.type==='werkstatt'){const ws=S.units.filter(u=>u.b===b.id);const r=prodRate(b)*60;
  h+=`<div class="sub">Produktion: <b>${r.toFixed(1).replace('.',',')} Knöpfe/Minute</b> · Arbeiter ${ws.length}/2${has('pavillon')?' · Pavillon-Bonus aktiv':''}</div>`;
  ws.forEach(u=>h+=`<div class="wk"><img src="${sockImg(u.s[0])}"><div class="grow"><b>${u.s.map(s=>s.n).join(' & ')}</b><br><small style="opacity:.6">${u.s.length>1?'Paar · zählt '+String(workerVal(u)).replace('.',','):'Einzelsocke · zählt 1'}</small></div><button data-rm="${u.id}" data-bid="${b.id}">Zur Bank</button></div>`);
  if(ws.length<2)h+='<p class="sub">Zieh eine Socke von der Wartebank auf die Werkstatt, um sie einzustellen.</p>'}
 if(b.type==='huette'||b.type==='zwilling')h+=`<div class="sub">Wohnplätze in Sockenheim: ${housing()} · Bewohner: ${sockCount()}</div>`;
 if(b.type==='lager')h+=`<div class="sub">Aktuelles Lagerlimit: ${cap()} je Material.</div>`;
 openSheet('info',h);
}
function renderTwin(){
 const singles=trayUnits().filter(u=>u.s.length===1);
 let h='<h2>Zwilling bei Freunden suchen</h2><div class="sub">Jede Socke hat irgendwo einen Zwilling, oft in der Stadt eines Freundes. Schick eine Einzelsocke los: Wer den Link öffnet, nimmt sie bei sich auf.</div>';
 if(G.giftLink){h+=`<p style="font:italic 14px Georgia">${G.giftName} ist verpackt. Der Link ist das Paket.</p><input class="link" id="glink" readonly value="${G.giftLink}"><div class="row"><button data-act="copy" style="flex:1">Link kopieren</button>${navigator.share?'<button data-act="share" style="flex:1">Teilen …</button>':''}</div><small class="note">Demo ohne Server: Die Socke steckt im Link. Gekaufte Dinge wären nicht tauschbar, nur erspielte Socken.</small>`;openSheet('twin',h);return}
 if(!singles.length){h+='<p class="sub">Keine Einzelsocke auf der Wartebank. Entweder alle verpaart oder alle bei der Arbeit.</p>'}
 else{h+='<div class="sockpick">'+singles.map(u=>`<button data-pick="${u.id}" class="${G.giftPick===u.id?'sel':''}"><img src="${sockImg(u.s[0])}"><b>${u.s[0].n}</b><span style="opacity:.6">${typeName(u.s[0].t)}</span></button>`).join('')+'</div>';
  const u=unitById(G.giftPick);h+=`<button data-act="send" style="width:100%" ${u&&u.b==null&&u.s.length===1?'':'disabled'}>${u?`${u.s[0].n} verschicken & Link erstellen`:'Erst eine Socke auswählen'}</button>`}
 h+=`<div class="bcard soon" style="margin-top:12px"><div style="width:58px;text-align:center;font-size:24px">〰</div><div><div class="t">Wäscheleine</div><div class="e">kommt bald</div><div class="d">Anonym mit allen Spielern tauschen, ganz ohne Freunde.</div></div></div>`;
 openSheet('twin',h);
}
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function sendGift(){
 const u=unitById(G.giftPick);if(!u||u.b!=null||u.s.length!==1)return;
 const s=u.s[0],id=Math.random().toString(36).slice(2,10);
 const link=location.href.split('#')[0]+'#socke='+b64e({id,t:s.t,n:s.n,tr:s.tr});
 S.units=S.units.filter(v=>v!==u);G.giftPick=null;G.giftLink=link;G.giftName=s.n;
 G.giftText=`${s.n} (${typeName(s.t)}) sucht ihren Zwilling. Ist er bei dir? Sockenheim:`;
 AU.squeak();toast(`${s.n} ist unterwegs. Gute Reise.`);save();renderTwin();
}
function checkGift(){
 const m=location.hash.match(/^#socke=([\w-]+)/);if(!m)return;
 let g;try{g=b64d(m[1])}catch(e){toast('Dieser Socken-Link ist zerknittert.');history.replaceState(null,'',location.pathname+location.search);return}
 if(!(g&&g.id&&g.t>=0&&g.t<24)){history.replaceState(null,'',location.pathname+location.search);return}
 if(S.gifts.includes(g.id)){toast('Diese Socke ist schon bei dir eingezogen. Zweimal geht nicht, auch nicht bei Socken.');history.replaceState(null,'',location.pathname+location.search);return}
 const s={t:g.t,n:String(g.n||'Unbekannt').slice(0,20),tr:TRAITS.includes(g.tr)?g.tr:'gelassen',seed:3,w:0};
 const twin=trayUnits().some(u=>u.s.length===1&&u.s[0].t===s.t)||S.units.some(u=>u.s.length===1&&u.s[0].t===s.t);
 modal(`<img class="big" src="${sockImg(s)}"><h2>Post von Freunden</h2><p><b>${s.n}</b> (${typeName(s.t)}) möchte bei dir einziehen.${twin?'<br><b style="color:#ffd27a">Ihr Zwilling wohnt schon in Sockenheim!</b>':''}</p><div class="row"><button id="gNo">Ablehnen</button><button id="gYes" style="background:linear-gradient(#a8783e,#7a522a)">Aufnehmen</button></div><small class="note">Demo ohne Server. Jeder Link funktioniert nur einmal pro Gerät.</small>`);
 $('#gYes').onclick=()=>{AU.init();S.gifts.push(g.id);addUnit(s);closeModal();AU.pair();const [px,py]=traySlotPos(trayUnits().length-1);lintConfetti(px,py-30,30);toast(twin?`${s.n} ist da. Und da drüben sitzt jemand, der genauso aussieht …`:`${s.n} ist eingezogen. Wirkt reisemüde.`);history.replaceState(null,'',location.pathname+location.search);refreshHUD();save()};
 $('#gNo').onclick=()=>{closeModal();history.replaceState(null,'',location.pathname+location.search);toast('Abgelehnt. Die Socke nimmt es sportlich.')};
}
function renderMenu(){
 openSheet('menu',`<h2>Sockenheim</h2><div class="sub">Demo · Version 0.1</div>
 <button data-act="mute" style="width:100%;margin:4px 0">Ton: ${S.mute?'aus':'an'}</button>
 <button data-act="tut" style="width:100%;margin:4px 0">Tutorial-Hinweise wieder anzeigen</button>
 <div class="bcard soon"><div style="width:58px;text-align:center;font-size:24px">✦</div><div><div class="t">Weichspüler-Abo · Saisonpass · Event-Socken</div><div class="e">kommt bald</div><div class="d">Nicht Teil der Demo. Kein Echtgeld, keine Werbung.</div></div></div>
 <p class="sub">Fundstücke bisher: ${S.rare} · Paare: ${S.pairs} · Gefangen: ${S.caught||0} · Waschgänge: ${S.washN}</p>
 <p class="sub">Gespeichert wird nur auf diesem Gerät. Offline-Produktion zählt höchstens 2 Stunden.</p>
 <button data-act="reset" style="width:100%;margin-top:6px;border-color:#8a3a2a">Spielstand löschen</button>`);
}
function modal(html){$('#mcard').innerHTML=html;$('#modal').style.display='flex'}
function closeModal(){$('#modal').style.display='none'}
function bedTeaser(){
 const n=sockCount();
 if(n<10){modal(`<h2>Unter dem Bett</h2><p>Gesperrt, bis Sockenheim 10 Socken zählt. Aktuell: <b>${n}</b>.<br><i>Man hört von dort Geräusche. Vermutlich nur eine Staubmaus.</i></p><div class="row"><button id="mOk">Verstanden</button></div>`)}
 else{modal(`<h2>Unter dem Bett</h2><p><b>10 Socken!</b> Der Weg unters Bett ist frei … in der Vollversion.<br><br><i>Dort warten Sofaritzen, ein Autositz und eine Staubmaus, die Miete verlangt.</i></p><div class="row"><button id="mOk">Bis bald</button></div><small class="note">Hier endet die Demo. Weiterbauen geht natürlich trotzdem.</small>`)}
 $('#mOk').onclick=closeModal;
}
function checkBed(){if(!S.bedSeen&&sockCount()>=10){S.bedSeen=1;G.bedPending=G.t+1.5}}
function bedTick(){if(G.bedPending&&G.t>G.bedPending&&S.tut>=TUT.length&&!G.wash&&!G.sheet&&!G.drag&&$('#modal').style.display!=='flex'){G.bedPending=0;bedTeaser()}}
$('#bBuild').onclick=()=>{AU.init();AU.click();renderBuild()};
$('#bTwin').onclick=()=>{AU.init();AU.click();G.giftLink=null;renderTwin()};
$('#bMenu').onclick=()=>{AU.init();AU.click();renderMenu()};
$('#t0').onclick=()=>{AU.click();goArea(0)};$('#t1').onclick=()=>{AU.click();goArea(1)};$('#t2').onclick=()=>{AU.init();AU.click();bedTeaser()};

/* ---------- Tutorial ---------- */
const tutEl=$('#tut'),tutT=$('#tutT'),hand=$('#hand');
let tutShown='';
const TUT=[
 {t:'Willkommen hinter der Waschmaschine. Hier landet alles, was oben keiner vermisst. Du bist ab sofort Bürgermeister. Gleich läuft der erste Waschgang.',pos:'bottom'},
 {t:'Schleudergang! Tippe auf Teile, die herausfliegen. Gefangenes zählt doppelt, gefangene Socken ziehen direkt ein.',pos:'bottom'},
 {t:'Der Rest liegt jetzt herum. Antippen oder einfach drüberwischen.',pos:'top'},
 {t:'Socken brauchen ein Dach. Bau eine Fusselhütte.',pos:'top',b:'huette'},
 {t:'Ohne Knöpfe keine Stadt. Bau eine Knopf-Werkstatt.',pos:'top',b:'werkstatt'},
 {t:'Zieh eine Socke von der Wartebank in die Werkstatt. Arbeit adelt, sagt man.',pos:'top'},
 {t:'Sie produziert. Im nächsten Waschgang ist garantiert ein Zwilling dabei. Fang ihn!',pos:'top'},
 {t:'Zwei gleiche Socken! Tippe beide nacheinander an.',pos:'top'},
 {t:'Hinter dem Spalt liegt der Trockner. Bau die Gummiseil-Brücke.',pos:'top',b:'bruecke'},
 {t:'Unter dem Trockner ist Platz für mehr. Ab 10 Socken lockt „Unter dem Bett“. Viel Erfolg, Bürgermeister.',pos:'top',ok:1}
];
function twinPair(){const tu=trayUnits().filter(u=>u.s.length===1);for(let i=0;i<tu.length;i++)for(let j=i+1;j<tu.length;j++)if(tu[i].s[0].t===tu[j].s[0].t)return[tu[i],tu[j]];return null}
function tutAdvance(){const s=S.tut;
 if(s===0&&G.wash)S.tut=1;
 else if(s===1&&!G.wash)S.tut=2;
 else if(s===2&&!G.items.some(i=>i.st==='floor'||i.st==='fly'))S.tut=3;
 else if(s===3&&has('huette'))S.tut=4;
 else if(s===4&&has('werkstatt'))S.tut=5;
 else if(s===5&&S.units.some(u=>u.b!=null))S.tut=6;
 else if(s===6&&(twinPair()||S.pairs>0))S.tut=S.pairs>0?8:7;
 else if(s===7&&S.pairs>0)S.tut=8;
 else if(s===8&&has('bruecke'))S.tut=9;
}
function placeHand(x,y,press){hand.style.display='block';hand.style.transform=`translate(${x-21}px,${y-3}px) scale(${press?.88:1})`}
function tutUpdate(){
 G.tutHi=null;
 if(S.tut>=TUT.length||$('#modal').style.display==='flex'){tutEl.style.display='none';hand.style.display='none';$('#toasts').style.top=G.wash?(L.floorY+6)+'px':'';return}
 tutAdvance();if(S.tut>=TUT.length){tutEl.style.display='none';hand.style.display='none';return}
 const st=TUT[S.tut];let txt=st.t;
 if(st.b&&!canAfford(BD[st.b].cost))txt+=' <i>(Material fehlt noch: sammeln oder auf den nächsten Waschgang warten.)</i>';
 if(S.tut===6&&G.items.some(i=>i.k==='sock'&&i.st==='floor'))txt='Neue Socken liegen herum. Einsammeln, vielleicht ist der Zwilling dabei.';
 const key=S.tut+txt;
 if(key!==tutShown){tutShown=key;tutT.innerHTML=txt+(st.ok?'<br><button class="ok" id="tutOk">Alles klar</button>':'');const ok=$('#tutOk');if(ok)ok.onclick=()=>{S.tut=99;save()}}
 tutEl.style.display=(G.sheet&&!st.b)||(G.wash&&S.tut!==1)?'none':'block';
 if(G.sheet){tutEl.style.top='auto';tutEl.style.bottom='auto';tutEl.style.top=(L.top+4)+'px'}
 else if(st.pos==='bottom'){tutEl.style.top='auto';tutEl.style.bottom=(H-L.trayTop+8)+'px'}else{tutEl.style.bottom='auto';tutEl.style.top=(L.top+4)+'px'}
 // Hand
 const pr=Math.sin(G.t*6)>0;let hx=null,hy=null,press=pr;
 if(S.tut===0&&L.lcd){hx=L.lcd.x+L.lcd.w/2-G.cam;hy=L.lcd.y+L.lcd.h}
 else if(S.tut===1&&G.wash){const f=G.items.filter(i=>i.st==='fly').sort((a,b)=>b.y-a.y)[0];if(f){hx=f.x-G.cam;hy=f.y-8}else{hx=L.px;hy=L.py+L.pr+20}}
 else if(S.tut===2){const f=G.items.find(i=>i.st==='floor');if(f){hx=f.x-G.cam;hy=f.y-8}}
 else if(st.b){if(G.sheet==='build'){const el=$('#card_'+st.b);if(el){const r=el.getBoundingClientRect();if(r.top<H-40){hx=r.left+40;hy=r.top+r.height/2}}}else if(!G.sheet&&canAfford(BD[st.b].cost)){const r=$('#bBuild').getBoundingClientRect();hx=r.left+r.width/2;hy=r.top+r.height/2}}
 else if(S.tut===5&&!G.sheet){const tu=trayUnits(),b=S.b.find(x=>x.type==='werkstatt');if(tu.length&&b&&!G.drag){const [ax,ay]=traySlotPos(0),p=bPos(b);const k=(G.t*.6)%1,e=easeIO(clamp(k*1.3,0,1));hx=lerp(ax,p.x-G.cam,e);hy=lerp(ay-20,p.y-L.bs*.4,e);press=k<.8;G.tutHi=[tu[0].id]}}
 else if(S.tut===7&&!G.sheet){const tp=twinPair();if(tp){G.tutHi=tp.map(u=>u.id);const idx=G.sel===tp[0]?1:Math.floor(G.t*.8)%2;const [x,y]=traySlotPos(trayUnits().indexOf(tp[idx]));hx=x;hy=y-20}}
 const tb=$('#toasts');if(G.wash)tb.style.top=(L.floorY+6)+'px';else if(tutEl.style.display==='block'&&tutEl.style.top!=='auto'){tb.style.top=(L.top+tutEl.offsetHeight+14)+'px'}else tb.style.top='';
 if(hx==null||G.drag)hand.style.display='none';else placeHand(hx,hy,press);
}
$('#tutSkip').onclick=()=>{S.tut=99;tutEl.style.display='none';hand.style.display='none';save();toast('Tutorial übersprungen. Ein Bürgermeister weiß, was er tut.')};

/* ---------- Hauptschleife ---------- */
let lastTs=0,hudT=0;
function frame(ts){
 const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;G.t+=dt;
 if(!G.wash&&Date.now()>=S.washAt){if(G.sheet)closeSheet();startWash()}
 updWash(dt);updItems(dt);updProd(dt);updParts(dt);
 G.cam=lerp(G.cam,G.area*W,1-Math.pow(.0005,dt));if(Math.abs(G.cam-G.area*W)<.5)G.cam=G.area*W;
 G.shake*=Math.pow(.02,dt);G.boxBump*=Math.pow(.01,dt);
 hudT-=dt;if(hudT<=0){hudT=.2;refreshHUD()}
 tutUpdate();bedTick();render();
 if(G.t-G.lastSave>5)save();
 requestAnimationFrame(frame);
}
function init(){
 S=load();AU.setMute(!!S.mute);if(S.bedSeen===1&&!S.bedShown){}
 layout();mkIcons();
 offlineGain();
 if(Date.now()>=S.washAt)S.washAt=Date.now()+1500;
 refreshHUD();goArea(0);
 checkGift();window.addEventListener('hashchange',checkGift);
 addEventListener('resize',()=>{layout();hudCache=''});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&!G.noSave)save()});
 addEventListener('pagehide',()=>{if(!G.noSave)save()});
 requestAnimationFrame(t=>{lastTs=t;requestAnimationFrame(frame)});
}
window.__sh={get S(){return S},G,get L(){return L},startWash,save,build,trayUnits,traySlotPos,bPos,bRect,setWashIn(ms){S.washAt=Date.now()+ms},housing,cap,prodRate,offlineGain};
init();
</script>
